# Atualiza os projetos recentes do ArtStation (feed RSS oficial) todos os dias.
# Se algo mudou, grava src/artstation.generated.json na branch main; o envio faz a Vercel publicar de novo.
# Para rodar na hora: aba Actions > "Atualizar ArtStation" > Run workflow.
name: Atualizar ArtStation

on:
  schedule:
    - cron: "17 9 * * *" # todo dia, 09:17 UTC (06:17 em Brasília)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-artstation
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Baixar o feed do ArtStation
        # Mesmo User-Agent honesto do script. O servidor do ArtStation às vezes recusa por um instante: 4 tentativas, 30 s entre elas.
        # Se não conseguir, o fluxo não falha (nada é atualizado hoje; tenta de novo amanhã).
        run: |
          curl -fsS --retry 3 --retry-delay 30 --retry-all-errors --max-time 30 \
            -A "jax-made-3d-portfolio-sync/1.0 (+https://jax-made-3d.vercel.app; sincronização do próprio perfil)" \
            -H "Accept: application/rss+xml" \
            -o feed.xml https://www.artstation.com/jonatas_araujo.rss \
            || echo "::warning::ArtStation recusou o download hoje; nada foi atualizado."
      - name: Atualizar o arquivo salvo
        if: hashFiles('feed.xml') != ''
        run: ARTSTATION_FEED_FILE=feed.xml node scripts/sync-artstation.mjs
      - name: Gravar se houve mudança
        run: |
          if git diff --quiet -- src/artstation.generated.json; then
            echo "Sem novos projetos no ArtStation."
            exit 0
          fi
          git config user.name "artstation-sync[bot]"
          git config user.email "artstation-sync@users.noreply.github.com"
          git add src/artstation.generated.json
          git commit -m "Atualiza projetos do ArtStation"
          git push
